<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>recipe-generator</title>
 <script src = "recipeGenerator.js" defer></script>
  </head>
  <body>
<main>
    <div class="emoji" id="emoji">🍽️</div>
    <h1 id="dish">Hungry?</h1>
    <p class="cuisine" id="cuisine">Pick a dish and stop overthinking it.</p>
 
    <select id="filter" aria-label="Filter by category">
      <option value="all">Anything</option>
      <option value="Meal">Meals</option>
      <option value="Snack">Snacks</option>
      <option value="Dessert">Desserts</option>
    </select>
    <button id="btn">Pick my food</button>
    <button id = "recipeBtn" disabled>Show recipe</button> 
  </main>

    
  </body>
</html>
