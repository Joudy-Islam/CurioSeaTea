<!doctype html>
<html lang="en">


<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>CurioSeaTea</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="aquarium-page">

    <header class="header">

      <div class="logo">
        <img src="Photos/CurioSEatea.png" alt="CurioSeaTea logo">
      </div>

      <button class="help-button" id="helpButton">
        ?
      </button>

    </header>


    <section class="aquarium" id="aquarium">

      <div class="water">

        <div class="water-light"></div>


        <div class="bubbles">
          <span></span>
          <span></span>
          <span></span>
          <span></span>
          <span></span>
          <span></span>
          <span></span>
          <span></span>
        </div>

        <div class="plants">

          <div class="plant plant-1"></div>
          <div class="plant plant-2"></div>
          <div class="plant plant-3"></div>
          <div class="plant plant-4"></div>

        </div>

        <button
          class="fish fish-purple"
          data-page="maloka"
          data-feeds="0"
          aria-label="Design and Art">

          <img
            src="Photos/fish-purple.png"
            alt="purple fish representing Design and Art">

        </button>

<!--problem-->
        <button
          class="fish fish-Colorful"
          data-page="movies"
          data-feeds="0"
          aria-label="Movies and Drama">

          <img
            src="Photos/fish-Colorful.png"
            alt="colorful fish representing Movies and Drama">

        </button>
        


        <button
          class="fish fish-red"
          data-page="recipeGenerator"
          data-feeds="0"
          aria-label="Cooking and Baking">

          <img
            src="Photos/fish-red.png"
            alt="red fish representing Cooking and Baking">

        </button>

<!--problem-->
        <button
          class="fish fish-orange"
          data-page="history"
          data-feeds="0"
          aria-label="Learning History and Culture">

          <img
            src="Photos/fish-orange.png"
            alt="orange fish representing Learning History and Culture">

        </button>


        <button
          class="fish fish-pink"
          data-page="act"
          data-feeds="0"
          aria-label="Exploring and Trying New Things">

          <img
            src="Photos/fish-pink.png"
            alt="pink fish representing Exploring and Trying New Things">

        </button>



        <div class="fish decorative-fish fish-small-1">
          <img
            src="Photos/fish-small-1.png"
            alt=""
            aria-hidden="true">
        </div>


        <div class="fish decorative-fish fish-small-2">
          <img
            src="Photos/fish-small-2.png"
            alt=""
            aria-hidden="true">
        </div>


        <div class="fish decorative-fish fish-small-3">
          <img
            src="Photos/fish-small-3.png"
            alt=""
            aria-hidden="true">
        </div>


        <div class="sand"></div>

      </div>


      <div class="glass"></div>

    </section>


    <section class="feeding-area">

      <div class="instruction">

        <p id="instructionText">
          Feed a fish to discover where it takes you.
        </p>

      </div>


      <button
        class="food-button"
        id="foodButton">

        <span class="food-icon">●</span>

        <span>FEED</span>

      </button>

    </section>


    <aside
      class="help-panel"
      id="helpPanel">

      <button
        class="close-help"
        id="closeHelp">

        ×

      </button>


      <h2>HOW TO EXPLORE</h2>


      <p>
        Choose a fish and feed it.
      </p>


      <p>
        Feed the same fish enough times
        and see what happens.
      </p>

    </aside>


  </main>


  <div id="root"></div>


  <script
    type="module"
    src="/src/main.jsx">
  </script>
<script 
src="aqaruim.js"></script>
</body>

</html/>
