<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CurioSeaTea</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
<body class="bg-pink-200 text-slate-800 min-h-screen flex flex-col items-center justify-between p-6 select-none border-4 border-pink-900/80 shadow-lg rounded-xl">

    <!-- Header -->
    <header class="text-center pt-4">
        <h1 class="text-5xl font-extrabold tracking-tight text-pink-900">Activity Spinner 🎡</h1>
        <p class="text-pink-900/80 text-lg mt-1 pt-3 font-medium">Bored and have nothing to do?</p>
        <h3 class="text-pink-900/80 text-lg font-medium">Let us help you find something to do!</h3>
    </header>

    <!-- Main Content -->
    <main class="w-full max-w-md flex flex-col items-center gap-6 my-auto">
        
        <!-- View 1: Interest Selector -->
        <div class="w-full space-y-4" id="interest-selector">
            <h2 class="text-3xl font-extrabold text-center text-pink-900 pb-6 tracking-tight">| Choose an Interest |</h2>
            <div class="grid grid-cols-2 gap-4">
              <button  class="p-5 bg-pink-300 hover:bg-pink-400 border-2 border-pink-900/80 rounded-2xl transition font-medium text-center shadow-md active:scale-95 group cursor-pointer">
                <span class="text-2xl block mb-1 group-hover:scale-110 transition-transform text-pink-900 font-bold">Arts 🎨</span>
              </button>
              <button class="p-5 bg-pink-300 hover:bg-pink-400 border-2 border-pink-900/80 rounded-2xl transition font-medium text-center shadow-md active:scale-95 group cursor-pointer">
                <span class="text-2xl block mb-1 group-hover:scale-110 transition-transform text-pink-900 font-bold">Sports 🏀</span>
              </button>
              <button  class="p-5 bg-pink-300 hover:bg-pink-400 border-2 border-pink-900/80 rounded-2xl transition font-medium text-center shadow-md active:scale-95 group cursor-pointer">
                <span class="text-2xl block mb-1 group-hover:scale-110 transition-transform text-pink-900 font-bold">Reading 📚</span>
              </button>
              <button class="p-5 bg-pink-300 hover:bg-pink-400 border-2 border-pink-900/80 rounded-2xl transition font-medium text-center shadow-md active:scale-95 group cursor-pointer">
                <span class="text-2xl block mb-1 group-hover:scale-110 transition-transform text-pink-900 font-bold">Gaming 🎮</span>
              </button>
            </div>
        </div>

        <!--The Activity Result Page-->
        <div id="activity-view" class="w-full bg-pink-100/80 border-2 border-pink-900/80 p-8 rounded-3xl text-center hidden space-y-6 shadow-xl">
            <div class="flex justify-between items-center">
                <button onclick="goBack()" class="text-sm font-bold text-pink-900 hover:underline cursor-pointer">← Back</button>
                <h2 id="category-title" class="text-2xl font-extrabold text-pink-900 capitalize"></h2>
                <div class="w-8"></div>
            </div>


            <div class="py-6 bg-pink-200 border-2 border-dashed border-pink-950/40 rounded-2xl shadow-inner">
                <span id="activity-display" class="text-xl font-bold text-pink-950 px-4 block">Click spin to find out!</span>
            </div>


            <div class="space-y-3">
                <button onclick="spinActivity()" id="spin-btn" class="w-full py-3.5 bg-pink-600 hover:bg-pink-700 text-white font-extrabold rounded-xl shadow-lg transition active:scale-95 cursor-pointer">
                    Spin for Activity! 🎲
                </button>
            </div>
        </div>

    </main>

    <footer class="text-xs text-pink-900 text-center pt-4 font-semibold">
        CurioSeaTea • Built with speed & love ☕💕
    </footer>

    <script>
    </script>
</body>
</html>
